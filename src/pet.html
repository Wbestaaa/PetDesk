<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PetDesk Pet</title>
    <link rel="stylesheet" href="pet.css" />
  </head>
  <body>
    <div id="stage" class="stage" title="双击打开 PetDesk">
      <div id="bubble" class="bubble"></div>
      <canvas id="pet" width="520" height="520"></canvas>
      <img id="customPet" class="custom-pet" alt="" />
      <div id="menu" class="pet-menu">
        <button data-action="feed">🍪 喂食</button>
        <button data-action="play">🪶 玩耍</button>
        <button data-action="study">📖 陪伴专注</button>
        <button data-action="sleep">🌙 睡觉</button>
        <button data-open>⚙️ 控制中心</button>
      </div>
    </div>
    <script src="pet.js"></script>
  </body>
</html>
